name: Release
# Two ways to release:
# - Actions > Release > Run workflow. Publishes Release Drafter's draft (optionally under a version you type),
#   after building the app and attaching the .dmg and .zip files to it.
# - Publish the draft yourself on the Releases page. This workflow then builds and attaches the files.
# The app's version comes from the release tag, so package.json's version doesn't need bumping.
on:
  push:
    branches: [claude/project-thread-mxp19w]  # TEMP: test run, removed before merge
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, like 0.2.0. Leave empty to use the draft release version.'
        required: false
      test_only:
        description: 'Test build only: sign, notarize and check the app, then keep it as a workflow artifact. No release is created or changed.'
        type: boolean
        default: false
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
      signed: ${{ steps.build.outputs.signed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the release
        id: rel
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WANT: ${{ inputs.version }}
          TEST_ONLY: ${{ inputs.test_only || github.event_name == 'push' }}
        run: |
          if [ "$TEST_ONLY" = "true" ]; then
            tag="v0.0.0-test.$GITHUB_RUN_NUMBER"
          elif [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)][0].tag_name // ""')
            if [ -n "$WANT" ]; then tag="v${WANT#v}"; else tag="$draft"; fi
            if [ -z "$tag" ]; then echo "::error::No draft release and no version given."; exit 1; fi
            if [ -n "$draft" ]; then
              # Point the draft at this commit, under the chosen version.
              gh release edit "$draft" --tag "$tag" --title "$tag" --target "$GITHUB_SHA" --draft=true
            else
              gh release create "$tag" --draft --generate-notes --title "$tag" --target "$GITHUB_SHA"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Signs and notarizes when the Apple secrets are set; otherwise builds an unsigned app.
      # The signing variables are only exported when set: electron-builder treats an empty CSC_LINK as a path.
      - run: node scripts/install-mac-binaries.cjs
      - name: Build and upload
        id: build
        env:
          SIGN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.rel.outputs.version }}
          # electron-builder uploads the dmg, zip and latest-mac.yml (read by the updater) into the release.
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ (inputs.test_only || github.event_name == 'push') && 'never' || 'always' }}
        run: |
          if [ -n "$SIGN_CSC_LINK" ]; then
            export CSC_LINK="$SIGN_CSC_LINK" CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
            if [ -n "$SIGN_APPLE_ID" ]; then
              export APPLE_ID="$SIGN_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
            fi
            sign=()
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets; building an unsigned app."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Ad-hoc sign like the preview build, so Apple silicon will run it.
            sign=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          npx electron-vite build
          npx electron-builder --mac --publish "$PUBLISH" -c.extraMetadata.version="$VERSION" "${sign[@]}"
      # The runner is a Mac, so check the result the way a person's Mac would.
      - name: Check signing and notarization
        if: steps.build.outputs.signed == 'true'
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Timestamp)'
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
          done
          # The bundled Claude binary must still start under the hardened runtime.
          claude="dist/mac-arm64/Choo Choo.app/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude"
          codesign -d --entitlements - "$claude"
          "$claude" --version
          for dmg in dist/*.dmg; do
            echo "== $dmg"
            codesign --verify --verbose=2 "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg" || echo "::warning::$dmg is not notarized itself (the app inside is)."
          done
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && !(inputs.test_only || github.event_name == 'push')
        run: gh release edit "${{ steps.rel.outputs.tag }}" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: choo-choo-mac
          path: |
            dist/*.dmg
            dist/*.zip

  # Updates the cask in Benbentwo/homebrew-tap so `brew install --cask benbentwo/tap/choo-choo` gets this release.
  # Needs a HOMEBREW_TAP_TOKEN secret that can push to that repo; skipped with a warning without it.
  homebrew:
    needs: mac
    if: ${{ !(inputs.test_only || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ needs.mac.outputs.tag }}
      VERSION: ${{ needs.mac.outputs.version }}
      SIGNED: ${{ needs.mac.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the Homebrew cask
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN secret; skipping the Homebrew cask update."
            exit 0
          fi
          mkdir -p dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "ChooChoo-$VERSION-arm64.dmg" --pattern "ChooChoo-$VERSION-x64.dmg"
          arm=$(shasum -a 256 "dl/ChooChoo-$VERSION-arm64.dmg" | cut -d' ' -f1)
          intel=$(shasum -a 256 "dl/ChooChoo-$VERSION-x64.dmg" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Benbentwo/homebrew-tap.git" tap
          mkdir -p tap/Casks
          scripts/homebrew-cask.sh "$VERSION" "$arm" "$intel" "${SIGNED:-false}" > tap/Casks/choo-choo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/choo-choo.rb
          if git diff --cached --quiet; then echo "Cask already up to date."; exit 0; fi
          git commit -m "choo-choo $VERSION"
          git push origin HEAD:main
