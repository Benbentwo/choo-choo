name: Beta
# Publishes a signed, notarized prerelease for every merge to main, for people on Settings > Updates > Beta.
# Stable releases are unchanged: Release Drafter keeps the draft and the Release workflow publishes it.
#
# Runs after Release Drafter so the version starts from the draft's next version, like v0.2.0-beta.57.
# Prereleases are never marked Latest, so stable users and the Homebrew cask never see them.
on:
  workflow_run:
    workflows: [Release Drafter]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, sign, notarize and check, but publish nothing.'
        type: boolean
        default: true
# A newer merge cancels the build in progress, so a burst of merges builds only the last one.
# Release Drafter's PR-event runs land in their own group so they never cancel a build.
concurrency:
  group: beta-${{ github.event.workflow_run.event || github.event_name }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  KEEP_BETAS: 10
jobs:
  mac:
    # Only merges to main (Release Drafter also runs on PR events).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Only a merge publishes; a manual run publishes only with dry run unticked.
      DRY_RUN: ${{ github.event_name != 'workflow_run' && (github.event_name != 'workflow_dispatch' || inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - name: Decide whether to build
        id: gate
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          # Unsigned builds can't update themselves, so a beta without signing would reach nobody.
          if [ "$HAS_CERT" != "true" ]; then
            echo "::warning::No signing secrets; skipping the beta build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Squash merges: the commit's own changes. Skip merges that only touch docs.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && ! git diff --name-only HEAD^ HEAD | grep -Ev '^(docs/|\.github/ISSUE_TEMPLATE/|.*\.md$)' > /dev/null; then
            echo "Only docs changed; no beta build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Pick the version
        id: ver
        if: steps.gate.outputs.build == 'true'
        run: |
          # Next stable version: Release Drafter's draft, else one patch past the latest release, else package.json.
          next=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)][0].tag_name // ""')
          next=${next#v}
          if [ -z "$next" ]; then
            stable=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            stable=${stable#v}
            if [ -n "$stable" ]; then
              IFS=. read -r ma mi pa <<< "${stable%%-*}"; next="$ma.$mi.$((pa + 1))"
            else
              next=$(node -p "require('./package.json').version")
            fi
          fi
          # The run number only grows, so later merges always sort as newer. Re-runs get their own suffix.
          n="$GITHUB_RUN_NUMBER"
          [ "$GITHUB_RUN_ATTEMPT" != "1" ] && n="$n.$GITHUB_RUN_ATTEMPT"
          version="$next-beta.$n"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Beta version: $version"
      - name: Create the draft prerelease
        if: steps.gate.outputs.build == 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Every PR merged since the last beta, not just this one: a newer merge cancels the build in
          # progress, and docs-only merges don't build. The app shows these lines under What's new.
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.prerelease and (.draft | not) and (.tag_name | test("-beta\\.")))][0].tag_name // ""')
          changes=""
          if [ -n "$prev" ]; then
            changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$SHA" --jq '[.commits[].commit.message | split("\n")[0]] | reverse | .[]' 2>/dev/null | head -n 50 || true)
          fi
          [ -z "$changes" ] && changes=$(git log -1 --format=%s HEAD)
          {
            printf 'Beta build of %s.\n\n## What'"'"'s changed\n\n' "$(git rev-parse --short HEAD)"
            printf '%s\n' "$changes" | sed 's/^/- /'
            printf '\nTurn on Settings > Updates > Update channel > Beta to get these builds automatically.\n'
          } > notes.md
          cat notes.md
          # A draft until every file is uploaded, so the updater never sees a half-finished release.
          gh release create "$TAG" --draft --prerelease --title "$TAG" --target "$SHA" --notes-file notes.md
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.build == 'true'
      - run: npm test
        if: steps.gate.outputs.build == 'true'
      - run: node scripts/install-mac-binaries.cjs
        if: steps.gate.outputs.build == 'true'
      - name: Build, sign, notarize and upload
        if: steps.gate.outputs.build == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          publish=always
          [ "$DRY_RUN" = "true" ] && publish=never
          npx electron-vite build
          # Uploads the dmg, zip and beta-mac.yml (read by the updater) into the draft prerelease.
          npx electron-builder --mac --publish "$publish" -c.extraMetadata.version="$VERSION" -c.publish.releaseType=prerelease
      - name: Check signing and notarization
        if: steps.gate.outputs.build == 'true'
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
          done
          claude="dist/mac-arm64/Choo Choo.app/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude"
          "$claude" --version
      - name: Publish the prerelease
        if: steps.gate.outputs.build == 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false
      - name: Remove the draft if the build failed or was cancelled
        if: (failure() || cancelled()) && steps.gate.outputs.build == 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo false)
          if [ "$draft" = "true" ]; then gh release delete "$TAG" --yes; fi
      - name: Keep only the newest betas
        if: steps.gate.outputs.build == 'true' && env.DRY_RUN != 'true'
        run: |
          # Published prereleases whose tag has -beta., newest first; delete all but KEEP_BETAS, tags too.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.draft | not) and (.tag_name | test("-beta\\."))) | [.created_at, .tag_name] | @tsv' \
            | sort -r | tail -n +$((KEEP_BETAS + 1)) | cut -f2 \
            | while read -r old; do echo "Removing $old"; gh release delete "$old" --yes --cleanup-tag; done
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.build == 'true' && env.DRY_RUN == 'true'
        with:
          name: choo-choo-beta-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
