appId: dev.benbentwo.choochoo
productName: Choo Choo
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# Native code must live outside the asar archive to load or execute.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  # Both Claude binaries are installed first (scripts/install-mac-binaries.cjs); afterPack keeps the matching one.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
afterPack: build/afterPack.cjs
# choo-choo://share links open a coworker's shared session.
protocols:
  - name: Choo Choo share link
    schemes: [choo-choo]
dmg:
  title: Choo Choo
publish:
  provider: github
  owner: Benbentwo
  repo: choo-choo
  releaseType: release
