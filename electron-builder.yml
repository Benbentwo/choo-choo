appId: dev.benbentwo.choochoo
productName: Choo Choo
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# Native code must live outside the asar archive to load or execute.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  # Both Claude binaries are installed first (scripts/install-mac-binaries.cjs); afterPack keeps the matching one.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  category: Development
  icon: resources/icon.png
  # x64 only to start. The Claude binary is installed first (scripts/install-claude-binaries.cjs linux).
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  mimeTypes: [x-scheme-handler/choo-choo]
appImage:
  artifactName: ChooChoo-${version}-x86_64.AppImage
deb:
  artifactName: choo-choo_${version}_amd64.deb
afterPack: build/afterPack.cjs
# choo-choo://share links open a coworker's shared session.
protocols:
  - name: Choo Choo share link
    schemes: [choo-choo]
dmg:
  title: Choo Choo
  # Sign the disk image too, with the same Developer ID as the app (skipped for unsigned builds).
  sign: true
  # Fixed, space-free names with the arch always present, so the Homebrew cask can build the URL.
  artifactName: ChooChoo-${version}-${arch}.${ext}
publish:
  provider: github
  owner: Benbentwo
  repo: choo-choo
  releaseType: release
